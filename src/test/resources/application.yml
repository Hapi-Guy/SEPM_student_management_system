# Test-only settings: replaces src/main/resources/application.yml while tests run,
# so the integration tests use an in-memory H2 database instead of PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:smstest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
